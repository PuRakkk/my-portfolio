        <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta
            name="description"
            content="Chon Sarak — Full-Stack Developer & AI Systems Builder in Cambodia. Specializing in FastAPI, Django, PostgreSQL, Next.js, Vue.js, and Agentic RAG workflows."
        />
        <meta
            name="keywords"
            content="Chon Sarak, Full Stack Developer, AI Developer, RAG, FastAPI, Django, Vue.js, Next.js, PostgreSQL, Cambodia"
        />
        <meta name="author" content="Chon Sarak" />
        <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />

        <!-- Open Graph -->
        <meta property="og:title" content="Chon Sarak | Full-Stack Developer & AI Systems" />
        <meta
            property="og:description"
            content="Full-Stack Developer building modern web applications, scalable backends, and AI-powered systems."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Chon Sarak | Full-Stack Developer & AI Systems"
        />
        <meta
            name="twitter:description"
            content="Full-Stack Developer building modern web applications, scalable backends, and AI-powered systems."
        />

        <!-- Google Fonts: Geist & Geist Mono -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Loaded without blocking first paint; text shows in the system font, then swaps to Geist -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
            />
        </noscript>

        <!-- Apply saved / system theme before first paint -->
        <script>
            (function () {
                var saved = null
                try { saved = localStorage.getItem('theme') } catch (e) {}
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
                if (dark) document.documentElement.classList.add('dark')
            })()
        </script>

        <title>Chon Sarak | Full-Stack Developer & AI Systems</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
        <!-- ChatEaver AI Widget -->
        <script
            src="https://chateaver.com/sdk/chat-widget.js"
            data-workspace-key="wk_live_dsUAiEwdGOR0bqyV7XvmDM8zN1BCfBuW"
            data-api-base-url="https://chateaver.com"
            data-mode="bubble"
            async
        ></script>
    </body>
</html>
